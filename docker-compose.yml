version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: foodbridge_db
    environment:
      POSTGRES_DB: foodbridge_db
      POSTGRES_USER: foodbridge_admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge_admin -d foodbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: foodbridge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./foodbridge-backend
      dockerfile: Dockerfile
    container_name: foodbridge_backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - ./foodbridge-backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: foodbridge_db
      POSTGRES_USER: foodbridge_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  asgi_channels:
    build:
      context: ./foodbridge-backend
      dockerfile: Dockerfile
    container_name: foodbridge_asgi
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      POSTGRES_DB: foodbridge_db
      POSTGRES_USER: foodbridge_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db

  celery:
    build:
      context: ./foodbridge-backend
      dockerfile: Dockerfile
    container_name: foodbridge_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - ./foodbridge-backend:/app
    environment:
      POSTGRES_DB: foodbridge_db
      POSTGRES_USER: foodbridge_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./foodbridge-frontend
      dockerfile: Dockerfile
    container_name: foodbridge_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
